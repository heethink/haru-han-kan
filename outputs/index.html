<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f4">
  <title>한 줄 메모 — 오늘의 생각을 가볍게</title>
  <style>
    :root{color-scheme:light;--ink:#282a27;--muted:#85877f;--line:#e9e7e1;--paper:#fff;--canvas:#f8f7f4;--green:#557a60;--green-dark:#3e6148;--pale:#edf3ed;--shadow:0 18px 55px rgba(48,49,41,.06);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:var(--canvas)}button,input{font:inherit}button{color:inherit}.app{width:min(960px,calc(100% - 40px));margin:0 auto;padding:34px 0 60px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:54px}.brand{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:760;letter-spacing:-.04em}.brand-mark{display:grid;place-items:center;width:36px;height:36px;color:#fff;background:var(--green);border-radius:12px}.brand-mark svg{width:19px}.top-date{color:var(--muted);font-size:13px}.hero{text-align:center;margin-bottom:34px}.eyebrow{display:inline-flex;align-items:center;gap:8px;color:var(--green);background:var(--pale);border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}h1{margin:18px 0 9px;font-size:36px;line-height:1.2;letter-spacing:-.065em}.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.composer{max-width:690px;margin:0 auto 46px;padding:9px;background:var(--paper);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow)}.compose-row{display:flex;gap:8px}.memo-input{min-width:0;flex:1;height:50px;padding:0 14px;color:var(--ink);background:transparent;border:0;outline:none;font-size:15px}.memo-input::placeholder{color:#a3a49d}.memo-input:focus-visible{outline:2px solid #9bb29d;outline-offset:-2px;border-radius:10px}.add{display:flex;align-items:center;justify-content:center;gap:8px;min-width:112px;height:50px;padding:0 16px;color:#fff;background:var(--green);border:0;border-radius:11px;cursor:pointer;font-weight:700;font-size:13px;transition:.18s}.add:hover{background:var(--green-dark);transform:translateY(-1px)}.add svg{width:16px}.compose-foot{display:flex;justify-content:space-between;padding:7px 13px 2px;color:#a0a198;font-size:11px}.compose-foot .count{font-variant-numeric:tabular-nums}.section-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:16px}.section-title{display:flex;align-items:baseline;gap:10px}.section-title h2{margin:0;font-size:18px;letter-spacing:-.04em}.total{color:var(--muted);font-size:12px}.tools{display:flex;align-items:center;gap:8px}.search-wrap{position:relative}.search-wrap svg{position:absolute;left:12px;top:50%;width:15px;transform:translateY(-50%);color:#9a9b93;pointer-events:none}.search{width:190px;height:38px;padding:0 12px 0 35px;background:var(--paper);border:1px solid var(--line);border-radius:10px;outline:none;font-size:12px}.search:focus{border-color:#91ad95;box-shadow:0 0 0 3px rgba(85,122,96,.1)}.clear-all{height:38px;padding:0 12px;color:#888a82;background:transparent;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:12px}.clear-all:hover{color:#a44f48;background:#fff8f7}.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.note{position:relative;min-height:116px;padding:19px 20px 16px;background:var(--paper);border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 18px rgba(40,42,39,.025);animation:appear .2s ease-out}.note::before{position:absolute;top:18px;left:0;width:3px;height:22px;background:#d6e2d5;border-radius:0 4px 4px 0;content:""}.note-text{margin:0 0 20px;font-size:15px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}.note-meta{display:flex;align-items:center;justify-content:space-between;color:#a0a198;font-size:11px}.delete{display:grid;place-items:center;width:30px;height:30px;margin:-8px -8px -8px 0;color:#a0a198;background:transparent;border:0;border-radius:8px;cursor:pointer;opacity:.65}.delete:hover,.delete:focus-visible{color:#ae5a52;background:#fbefee;opacity:1}.delete svg{width:16px}.empty{grid-column:1/-1;display:flex;min-height:230px;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);background:rgba(255,255,255,.55);border:1px dashed #deded6;border-radius:16px}.empty-icon{display:grid;place-items:center;width:50px;height:50px;margin-bottom:14px;color:var(--green);background:var(--pale);border-radius:16px}.empty-icon svg{width:22px}.empty strong{color:#565950;font-size:14px}.empty span{margin-top:7px;font-size:12px}.footer{display:flex;justify-content:center;gap:7px;margin-top:25px;color:#a1a198;font-size:11px}.footer svg{width:13px;color:var(--green)}:focus-visible{outline:3px solid rgba(85,122,96,.32);outline-offset:2px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes appear{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@media(max-width:640px){.app{width:min(520px,calc(100% - 30px));padding-top:22px}.topbar{margin-bottom:39px}.hero{margin-bottom:25px}h1{font-size:30px}.composer{margin-bottom:34px}.section-head{align-items:flex-start;flex-direction:column;gap:12px}.tools{width:100%}.search-wrap{flex:1}.search{width:100%}.notes{grid-template-columns:1fr;gap:9px}.note{min-height:100px}.clear-all{white-space:nowrap}}@media(max-width:380px){.top-date{font-size:11px}.add{min-width:50px;padding:0 13px}.add span{display:none}.memo-input{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 4.75h7l4 4v10.5H7zM14 5v4h4M10 13h5M10 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>한 줄 메모</div>
      <time class="top-date" id="todayDate"></time>
    </header>
    <main>
      <section class="hero" aria-labelledby="pageTitle">
        <span class="eyebrow"><span class="dot"></span>생각을 가볍게 기록해요</span>
        <h1 id="pageTitle">떠오른 생각을<br>한 줄로 남겨보세요.</h1>
        <p>좋았던 일도, 기억할 일도 짧게 적어두면 충분해요.</p>
      </section>
      <form class="composer" id="memoForm">
        <label class="sr-only" for="memoInput">새 메모</label>
        <div class="compose-row">
          <input class="memo-input" id="memoInput" maxlength="140" placeholder="지금 떠오른 생각은 무엇인가요?" autocomplete="off" required>
          <button class="add" type="submit"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>메모 남기기</span></button>
        </div>
        <div class="compose-foot"><span>Enter 키로 바로 저장할 수 있어요</span><span class="count" id="charCount">0 / 140</span></div>
      </form>
      <section aria-labelledby="notesTitle">
        <div class="section-head">
          <div class="section-title"><h2 id="notesTitle">내 메모</h2><span class="total" id="totalCount">0개</span></div>
          <div class="tools">
            <label class="sr-only" for="searchInput">메모 검색</label>
            <div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input class="search" id="searchInput" type="search" placeholder="메모 검색"></div>
            <button class="clear-all" id="clearAll" type="button">모두 지우기</button>
          </div>
        </div>
        <div class="notes" id="notesList" aria-live="polite"></div>
      </section>
    </main>
    <footer class="footer"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 5 6v5c0 4.8 3 8.2 7 10 4-1.8 7-5.2 7-10V6l-7-3Z" stroke="currentColor" stroke-width="1.6"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>메모는 지금 사용하는 브라우저에 자동 저장돼요</span></footer>
  </div>
  <div class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></div>
  <script>
    (() => {
      const KEY = 'one-line-memos-v1';
      const $ = (selector) => document.querySelector(selector);
      const input = $('#memoInput');
      const list = $('#notesList');
      const trashIcon = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 13h10l1-13M9 7V4h6v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      let notes = load();
      function load() {
        try { const value = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(value) ? value.filter(note => note && typeof note.text === 'string' && typeof note.createdAt === 'string') : []; }
        catch { return []; }
      }
      function save() { try { localStorage.setItem(KEY, JSON.stringify(notes)); } catch { announce('저장 공간이 부족해요.'); } }
      function announce(message) { const live = $('#announcement'); live.textContent = ''; requestAnimationFrame(() => { live.textContent = message; }); }
      function escapeHTML(value) { const el = document.createElement('span'); el.textContent = value; return el.innerHTML; }
      function formatDate(iso) { const date = new Date(iso); if (Number.isNaN(date.getTime())) return ''; return new Intl.DateTimeFormat('ko-KR', { month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false }).format(date); }
      function render() {
        const query = $('#searchInput').value.trim().toLocaleLowerCase('ko-KR');
        const visible = notes.filter(note => note.text.toLocaleLowerCase('ko-KR').includes(query));
        $('#totalCount').textContent = `${notes.length}개`;
        if (!visible.length) {
          const isSearching = Boolean(query);
          list.innerHTML = `<div class="empty"><span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 4.75h7l4 4v10.5H7zM14 5v4h4M10 13h5M10 16h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><strong>${isSearching ? '검색 결과가 없어요.' : '아직 메모가 없어요.'}</strong><span>${isSearching ? '다른 단어로 검색해 보세요.' : '위에 첫 번째 한 줄을 남겨보세요.'}</span></div>`;
          return;
        }
        list.innerHTML = visible.map(note => `<article class="note" data-id="${escapeHTML(note.id)}"><p class="note-text">${escapeHTML(note.text)}</p><div class="note-meta"><time datetime="${escapeHTML(note.createdAt)}">${escapeHTML(formatDate(note.createdAt))}</time><button class="delete" type="button" aria-label="메모 삭제: ${escapeHTML(note.text)}">${trashIcon}</button></div></article>`).join('');
      }
      $('#memoForm').addEventListener('submit', event => {
        event.preventDefault(); const text = input.value.trim(); if (!text) { input.focus(); return; }
        notes.unshift({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, text, createdAt: new Date().toISOString() });
        save(); input.value = ''; $('#charCount').textContent = '0 / 140'; $('#searchInput').value = ''; render(); input.focus(); announce('메모를 저장했어요.');
      });
      input.addEventListener('input', () => { $('#charCount').textContent = `${input.value.length} / 140`; });
      $('#searchInput').addEventListener('input', render);
      list.addEventListener('click', event => {
        const button = event.target.closest('.delete'); if (!button) return;
        const note = button.closest('[data-id]'); notes = notes.filter(item => item.id !== note.dataset.id); save(); render(); announce('메모를 삭제했어요.');
      });
      $('#clearAll').addEventListener('click', () => {
        if (!notes.length) return; notes = []; save(); render(); announce('모든 메모를 지웠어요.');
      });
      const now = new Date(); $('#todayDate').textContent = new Intl.DateTimeFormat('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' }).format(now); $('#todayDate').dateTime = now.toISOString().slice(0, 10);
      render();
    })();
  </script>
</body>
</html>
